name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            mc: '1.21.1'
            args: '-PteamQa'
            output: build
          - loader: neoforge
            mc: '1.21'
            args: '-PmcTarget=1.21'
            output: build/neoforge-1.21
          - loader: forge
            mc: '1.20.1'
            args: '-p versions/forge -Pmc=1.20.1'
            output: build/forge-1.20.1
          - loader: forge
            mc: '1.21.1'
            args: '-p versions/forge -Pmc=1.21.1'
            output: build/forge-1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run server tests
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew ${{ matrix.args }} build runGameTestServer --no-daemon --no-configuration-cache | tee game-tests.log
          grep -Eq 'All [0-9]+ required tests passed' game-tests.log
      - name: Verify artifacts
        shell: bash
        run: |
          python -m pip install Pillow==12.3.0
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          python tools/verify_assets.py
          python tools/verify_release.py '${{ matrix.output }}/libs/teamecon-${{ matrix.loader }}-${{ matrix.mc }}-'"${version}.jar" --loader '${{ matrix.loader }}' --mc '${{ matrix.mc }}'
      - uses: actions/upload-artifact@v4
        with:
          name: teamecon-${{ matrix.loader }}-${{ matrix.mc }}
          path: ${{ matrix.output }}/libs/teamecon-*.jar
